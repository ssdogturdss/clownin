name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (libs)
        run: pnpm typecheck:libs

      - name: Type check (API server)
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Type check (admin panel)
        run: pnpm --filter @workspace/admin-panel run typecheck
        env:
          PORT: '3000'
          BASE_PATH: '/admin-panel/'

      - name: Type check (mobile)
        run: pnpm --filter @workspace/clownin-mobile run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build admin panel
        run: pnpm --filter @workspace/admin-panel run build
        env:
          PORT: '3000'
          BASE_PATH: '/admin-panel/'
