name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (libs)
        run: pnpm typecheck:libs

      - name: Type check (API server)
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Type check (admin panel)
        run: pnpm --filter @workspace/admin-panel run typecheck
        env:
          PORT: '3000'
          BASE_PATH: '/admin-panel/'

      - name: Type check (mobile)
        run: pnpm --filter @workspace/clownin-mobile run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build admin panel
        run: pnpm --filter @workspace/admin-panel run build
        env:
          PORT: '3000'
          BASE_PATH: '/admin-panel/'

      - name: Build production Docker image
        run: docker build --target production --tag clownin:ci .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clownin
          POSTGRES_PASSWORD: clownin
          POSTGRES_DB: clownin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server (tests import from dist)
        run: pnpm --filter @workspace/api-server run build

      - name: Run API server tests
        run: pnpm --filter @workspace/api-server run test
        env:
          DATABASE_URL: postgresql://clownin:clownin@localhost:5432/clownin_test
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          SESSION_SECRET: ci-test-session-secret-not-for-production
          STUDIO_MASTER_KEY: ci-test-master-key-not-for-production
          ADMIN_USER_IDS: ci-admin
          NODE_ENV: test

      - name: Verify migrations apply to PostgreSQL
        run: pnpm --filter @workspace/db run migrate
        env:
          DATABASE_URL: postgresql://clownin:clownin@localhost:5432/clownin_test

  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Start a fresh portable stack
        env:
          DB_PASSWORD: ci-compose-password
          JWT_SECRET: ci-compose-jwt-secret-not-for-production
          SESSION_SECRET: ci-compose-session-secret-not-for-production
          STUDIO_MASTER_KEY: ci-compose-master-key-not-for-production
          HOST_PORT: '18080'
        run: docker compose up --build --detach

      - name: Verify API health and bundled admin panel
        run: |
          curl --fail --retry 10 --retry-connrefused http://localhost:18080/api/healthz
          curl --fail --retry 10 --retry-connrefused http://localhost:18080/admin-panel/ | grep -qi '<!doctype html'

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop portable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
