# Clownin — nginx site configuration
# Placeholders replaced by setup.sh:
#   %DOMAIN%      → your domain or _ (catch-all)
#   %ADMIN_DIST%  → absolute path to admin panel dist/
#   %API_PORT%    → API server port (default 8080)
#
# To install manually:
#   sudo cp this file to /etc/nginx/sites-available/clownin
#   sudo sed -i 's|%DOMAIN%|yourdomain.com|g; s|%ADMIN_DIST%|/opt/clownin/artifacts/admin-panel/dist|g; s|%API_PORT%|8080|g' /etc/nginx/sites-available/clownin
#   sudo ln -sf /etc/nginx/sites-available/clownin /etc/nginx/sites-enabled/clownin
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name %DOMAIN%;

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/clownin_access.log;
    error_log  /var/log/nginx/clownin_error.log warn;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── API: proxy all /api requests to the Node.js server ────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:%API_PORT%;
        proxy_http_version 1.1;

        # WebSocket support (used by code execution terminal)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — code execution can take a while
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Disable buffering for streaming responses (AI output)
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Admin panel: static files ──────────────────────────────────────────────
    location /admin/ {
        alias %ADMIN_DIST%/;
        try_files $uri $uri/ /admin/index.html;

        # Cache hashed assets for a year; HTML itself must revalidate
        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Health check endpoint ──────────────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:%API_PORT%/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Block hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
