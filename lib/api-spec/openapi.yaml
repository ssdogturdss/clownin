openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Clownin API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: projects
    description: Project management
  - name: files
    description: File management
  - name: execution
    description: Code execution
  - name: templates
    description: Starter templates
  - name: servers
    description: SSH server management
  - name: admin
    description: Admin-only operations (requires ADMIN_USER_IDS)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List SSH servers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of servers (credentials omitted)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerConfig"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createServer
      tags: [servers]
      summary: Add a new SSH server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerBody"
      responses:
        "201":
          description: ServerConfig created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers/{id}:
    get:
      operationId: getServer
      tags: [servers]
      summary: Get a single SSH server
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ServerConfig details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateServer
      tags: [servers]
      summary: Update an SSH server
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerBody"
      responses:
        "200":
          description: ServerConfig updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete an SSH server
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers/{id}/test:
    post:
      operationId: testServerConnection
      tags: [servers]
      summary: Test SSH connectivity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List starter templates
      description: Returns all available starter templates (no auth required). File contents are not included; the server populates files when a project is created from a template.
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List user's projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project with its files
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project with files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithFiles"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Project deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/preview/enable:
    post:
      operationId: enablePreview
      tags: [projects]
      summary: Enable the public preview link for a project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Preview enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnablePreviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List files in a project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectFile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFile
      tags: [files]
      summary: Create a file in a project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileBody"
      responses:
        "201":
          description: File created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/files/{fileId}:
    get:
      operationId: getFile
      tags: [files]
      summary: Get a file
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: fileId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: File
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateFile
      tags: [files]
      summary: Update a file's content
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: fileId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFileBody"
      responses:
        "200":
          description: File updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: fileId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: File deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/execute:
    post:
      operationId: executeCode
      tags: [execution]
      summary: Execute a file (SSE stream)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteBody"
      responses:
        "200":
          description: SSE stream of execution output
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Overall platform statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Edit a user's subscription or daily count
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/projects:
    get:
      operationId: listAdminProjects
      tags: [admin]
      summary: List all projects (paginated)
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: Projects page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProjectsPage"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/projects/{id}:
    delete:
      operationId: deleteAdminProject
      tags: [admin]
      summary: Delete any project
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/promo-codes:
    get:
      operationId: listPromoCodes
      tags: [admin]
      summary: List all promo codes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Promo codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromoCode"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      operationId: createPromoCode
      tags: [admin]
      summary: Generate a new promo code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeInput"
      responses:
        "201":
          description: Created promo code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/promo-codes/{id}:
    patch:
      operationId: updatePromoCode
      tags: [admin]
      summary: Edit a promo code
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeUpdate"
      responses:
        "200":
          description: Updated promo code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      operationId: deletePromoCode
      tags: [admin]
      summary: Delete a promo code
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/providers:
    get:
      operationId: listProviders
      tags: [admin]
      summary: List AI provider configs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderConfig"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/providers/{provider}:
    patch:
      operationId: updateProvider
      tags: [admin]
      summary: Update an AI provider (set key, toggle active)
      security:
        - bearerAuth: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConfigUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /secrets:
    get:
      operationId: listSecrets
      tags: [secrets]
      summary: List vault secrets
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of vault secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items: { $ref: "#/components/schemas/VaultSecret" }
                required: [secrets]
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      operationId: upsertSecret
      tags: [secrets]
      summary: Create or update a vault secret
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertSecretBody" }
      responses:
        "204": { description: Saved }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /secrets/{id}:
    delete:
      operationId: deleteSecret
      tags: [secrets]
      summary: Delete a vault secret
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /projects/{id}/env/from-secret/{secretId}:
    post:
      operationId: injectSecretIntoEnv
      tags: [secrets]
      summary: Copy a vault secret value into a project env var
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: secretId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overrideName: { type: string }
      responses:
        "204": { description: Injected }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /promo-codes/redeem:
    post:
      operationId: redeemPromoCode
      tags: [auth]
      summary: Redeem a promo code
      description: Validates the promo code and upgrades the authenticated user's subscription tier.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemPromoCodeBody"
      responses:
        "200":
          description: Code redeemed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemPromoCodeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invalid promo code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already on this tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Code expired or exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RegisterBody:
      type: object
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: string
        password:
          type: string
          minLength: 6
      required:
        - username
        - email
        - password

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: string
        password:
          type: string
      required:
        - email
        - password

    UserProfile:
      type: object
      properties:
        id:
          type: number
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        subscriptionTier:
          type: string
          enum: [free, pro]
          description: The user's current subscription tier
        dailyMessageCount:
          type: number
          description: Number of AI messages sent today (resets at start of each new day)
        dailyMessageLimit:
          type: number
          nullable: true
          description: Daily message cap for the current tier; null means unlimited (Pro)
      required:
        - id
        - username
        - email
        - createdAt
        - subscriptionTier
        - dailyMessageCount

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    Project:
      type: object
      properties:
        id:
          type: number
        userId:
          type: number
        name:
          type: string
        language:
          type: string
        description:
          type: string
          nullable: true
        serverId:
          type: number
          nullable: true
          description: SSH server to run code on (null means run locally)
        previewEnabled:
          type: boolean
          description: Whether the public preview link is active
        previewShortId:
          type: string
          nullable: true
          description: Short ID used in the public preview URL (/preview/:shortId)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - language
        - previewEnabled
        - createdAt
        - updatedAt

    EnablePreviewResponse:
      type: object
      properties:
        shortId:
          type: string
        previewEnabled:
          type: boolean
      required:
        - shortId
        - previewEnabled

    ProjectWithFiles:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/ProjectFile"
          required:
            - files

    Template:
      type: object
      properties:
        id:
          type: string
          description: Unique slug identifier for the template
        name:
          type: string
        description:
          type: string
        language:
          type: string
        icon:
          type: string
          description: MaterialCommunityIcons icon name shown in the gallery
      required:
        - id
        - name
        - description
        - language
        - icon

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        language:
          type: string
          default: javascript
        description:
          type: string
        templateId:
          type: string
          description: When set, the project is populated with the template's files instead of the default blank file
      required:
        - name

    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        serverId:
          type: number
          nullable: true
          description: SSH server to run code on (null means run locally)

    ProjectFile:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        path:
          type: string
        content:
          type: string
        language:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - path
        - content
        - language
        - createdAt
        - updatedAt

    CreateFileBody:
      type: object
      properties:
        path:
          type: string
          minLength: 1
        content:
          type: string
          default: ""
        language:
          type: string
          default: plaintext
      required:
        - path

    UpdateFileBody:
      type: object
      properties:
        content:
          type: string
        path:
          type: string
        language:
          type: string

    ExecuteBody:
      type: object
      properties:
        fileId:
          type: number
      required:
        - fileId

    ServerConfig:
      type: object
      properties:
        id:
          type: number
        userId:
          type: number
        name:
          type: string
        host:
          type: string
        port:
          type: number
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - host
        - port
        - username
        - createdAt
        - updatedAt

    CreateServerBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        host:
          type: string
          minLength: 1
        port:
          type: number
          default: 22
        username:
          type: string
          minLength: 1
        password:
          type: string
        privateKey:
          type: string
      required:
        - name
        - host
        - username

    UpdateServerBody:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: number
        username:
          type: string
        password:
          type: string
        privateKey:
          type: string

    TestConnectionResult:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
      required:
        - ok

    AdminStats:
      type: object
      properties:
        userCount: { type: number }
        projectCount: { type: number }
        promoCount: { type: number }
        proCount: { type: number }
      required: [userCount, projectCount, promoCount, proCount]

    AdminUser:
      type: object
      properties:
        id: { type: number }
        username: { type: string }
        email: { type: string }
        subscriptionTier: { type: string, enum: [free, pro] }
        dailyMessageCount: { type: number }
        lastMessageDate: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        projectCount: { type: number }
      required: [id, username, email, subscriptionTier, dailyMessageCount, projectCount, createdAt]

    AdminUserUpdate:
      type: object
      properties:
        subscriptionTier: { type: string, enum: [free, pro] }
        dailyMessageCount: { type: number, minimum: 0 }

    AdminProject:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        language: { type: string }
        userId: { type: number }
        username: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
        fileCount: { type: number }
      required: [id, name, language, userId, updatedAt, fileCount]

    AdminProjectsPage:
      type: object
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/AdminProject" }
        total: { type: number }
        page: { type: number }
        pages: { type: number }
      required: [projects, total, page, pages]

    PromoCode:
      type: object
      properties:
        id: { type: number }
        code: { type: string }
        tier: { type: string }
        maxUses: { type: number }
        usedCount: { type: number }
        expiresAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdBy: { type: number }
        createdAt: { type: string, format: date-time }
      required: [id, code, tier, maxUses, usedCount, isActive, createdBy, createdAt]

    PromoCodeInput:
      type: object
      properties:
        code: { type: string, minLength: 4, maxLength: 64 }
        tier: { type: string, enum: [pro] }
        maxUses: { type: number, minimum: 1 }
        expiresAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    PromoCodeUpdate:
      type: object
      properties:
        maxUses: { type: number, minimum: 1 }
        usedCount: { type: number, minimum: 0 }
        expiresAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        isActive: { type: boolean }

    ProviderConfig:
      type: object
      properties:
        provider: { type: string }
        displayName: { type: string }
        isActive: { type: boolean }
        hasApiKey: { type: boolean }
        model: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
      required: [provider, displayName, isActive, hasApiKey]

    RedeemPromoCodeBody:
      type: object
      properties:
        code:
          type: string
          minLength: 1
      required:
        - code

    RedeemPromoCodeResponse:
      type: object
      properties:
        tier:
          type: string
          enum: [free, pro]
        message:
          type: string
      required:
        - tier
        - message

    ProviderConfigUpdate:
      type: object
      properties:
        apiKey: { type: string }
        isActive: { type: boolean }
        clearKey: { type: boolean }
        model: { type: ["string", "null"] }

    VaultSecret:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        description: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, createdAt, updatedAt]

    UpsertSecretBody:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        description: { type: ["string", "null"] }
      required: [name, value]
