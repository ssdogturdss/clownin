# Clownin — Docker Compose (API server + PostgreSQL)
#
# Quick start:
#   cp .env.example .env        # fill in DB_PASSWORD, JWT_SECRET, and STUDIO_MASTER_KEY
#   docker compose up --build
#
# The API server is available at http://localhost:8080/api/
# The admin panel is available at http://localhost:8080/admin-panel/
#
# Migrations run automatically through the one-shot `migrate` service before
# the API starts. To rerun them manually: docker compose run --rm migrate

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       clownin
      POSTGRES_USER:     clownin
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── Database migrations ─────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://clownin:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/clownin"

  # ── API server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target:  production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Database — points to the companion db service
      DATABASE_URL: "postgresql://clownin:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/clownin"

      # Required secrets — set these in your .env file
      JWT_SECRET:        "${JWT_SECRET}"
      SESSION_SECRET:    "${SESSION_SECRET}"
      STUDIO_MASTER_KEY: "${STUDIO_MASTER_KEY}"
      ADMIN_USER_IDS:    "${ADMIN_USER_IDS:-}"

      # AI providers — set at least one
      OPENAI_API_KEY:    "${OPENAI_API_KEY:-}"

      # RevenueCat (optional — leave blank to disable subscription features)
      REVENUECAT_API_KEY:             "${REVENUECAT_API_KEY:-}"
      REVENUECAT_PRO_ENTITLEMENT_ID:  "${REVENUECAT_PRO_ENTITLEMENT_ID:-pro}"
      REVENUECAT_WEBHOOK_SECRET:      "${REVENUECAT_WEBHOOK_SECRET:-}"
      REVENUECAT_WEBHOOK_SECRET_PREV: "${REVENUECAT_WEBHOOK_SECRET_PREV:-}"
      SYNC_ALERT_WEBHOOK_URL:         "${SYNC_ALERT_WEBHOOK_URL:-}"

      # Server
      PORT:      "8080"
      NODE_ENV:  "production"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PUBLIC_API_URL: "${PUBLIC_API_URL:-}"
      ADMIN_PANEL_DIR: "/app/admin-panel"

volumes:
  pgdata:
